<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global AI Talent Distribution — Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #ffffff;
    --black: #202020;
    --petrol: #134550;
    --steel: #6C9FC6;
    --lavender: #E0E3FF;
    --europe-blue: #3C50FF;
    --brown: #713333;
    --mocha: #DEA580;
    --ecru: #F9F4CA;
    --orange: #FF7F48;
    --gray-light: #f2f3f5;
    --gray-mid: #8b8f96;
    --gray-border: #e5e7eb;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--white);
    color: var(--black);
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 24px 20px;
  }

  .accent-bar {
    height: 4px;
    background: linear-gradient(90deg, var(--orange), var(--mocha), var(--lavender));
    margin-bottom: 20px;
  }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .logo-mark { height: 18px; opacity: 0.5; }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--black);
    line-height: 1.2;
  }

  .subtitle {
    font-size: 13px;
    color: var(--gray-mid);
    font-weight: 400;
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .divider {
    height: 2px;
    background: var(--black);
    margin-bottom: 16px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .toggle-group {
    display: inline-flex;
    border-radius: 6px;
    border: 1px solid var(--gray-border);
    overflow: hidden;
    background: var(--gray-light);
  }

  .toggle-btn {
    padding: 7px 14px;
    border: none;
    background: transparent;
    color: #4a4a4a;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', system-ui, sans-serif;
    white-space: nowrap;
    letter-spacing: 0.01em;
    transition: all 0.15s ease;
    line-height: 1.3;
  }

  .toggle-btn:hover:not(.active):not(:disabled) { background: #dde0e4; }
  .toggle-btn.active { background: var(--petrol); color: var(--white); font-weight: 600; }
  .toggle-btn:disabled { color: #b0b5bb; cursor: not-allowed; }

  /* Excl toggle row */
  .excl-row {
    display: none;
    justify-content: flex-end;
    margin-bottom: 10px;
  }

  .excl-row.visible { display: flex; }

  .excl-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #4a4a4a;
    cursor: pointer;
    user-select: none;
  }

  .switch-track {
    display: inline-block;
    width: 34px;
    height: 18px;
    border-radius: 9px;
    background: #d6dadd;
    position: relative;
    transition: background 0.2s;
    cursor: pointer;
    flex-shrink: 0;
  }

  .switch-track.on { background: var(--steel); }

  .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 7px;
    background: #fff;
    transition: left 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .switch-track.on .switch-thumb { left: 18px; }

  /* Chart header */
  .chart-header {
    margin-bottom: 12px;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--black);
    letter-spacing: -0.14px;
  }

  .axis-label {
    font-size: 10px;
    color: var(--gray-mid);
    letter-spacing: 0.6px;
    font-weight: 500;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Chart */
  svg.chart {
    display: block;
    width: 100%;
    overflow: visible;
  }

  .bar-rect {
    transition: width 0.45s cubic-bezier(0.23, 1, 0.32, 1);
  }

  /* Source */
  .source-line {
    height: 1px;
    background: var(--gray-border);
    margin-top: 16px;
    margin-bottom: 8px;
  }

  .source-text {
    font-size: 10.5px;
    color: #9ca3af;
    text-align: right;
  }
</style>
</head>

var state = { geo: 'countries', measure: 'absolute', tier: 1, exclInUs: false };
var ns = 'http://www.w3.org/2000/svg';

function getKey(g, m, t, e) {
  var k = g + '_' + m + '_tier' + t;
  if (e) k += '_excl';
  return k;
}

function hasData(g, m, t, e) { return !!CHART_DATA[getKey(g, m, t, e)]; }

function getAvailTiers(g, m) {
  var t = [];
  for (var i = 0; i <= 2; i++) { if (hasData(g, m, i, false) || hasData(g, m, i, true)) t.push(i); }
  return t;
}

function formatVal(v, m) {
  if (m === 'percapita') return v.toFixed(2);
  if (v >= 1000) {
    var s = Math.round(v).toString();
    var r = '';
    for (var i = s.length - 1, c = 0; i >= 0; i--, c++) {
      if (c > 0 && c % 3 === 0) r = ',' + r;
      r = s[i] + r;
    }
    return r;
  }
  return v.toString();
}

function updateToggle(gid, val) {
  var btns = document.getElementById(gid).querySelectorAll('.toggle-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-val') === String(val));
  }
}

function updateTierDisabled() {
  var avail = getAvailTiers(state.geo, state.measure);
  var btns = document.getElementById('tier-group').querySelectorAll('.toggle-btn');
  for (var i = 0; i < btns.length; i++) {
    var t = parseInt(btns[i].getAttribute('data-val'));
    btns[i].disabled = avail.indexOf(t) === -1;
    if (btns[i].disabled) btns[i].classList.remove('active');
  }
  if (avail.indexOf(state.tier) === -1) {
    state.tier = avail[0] || 1;
    updateToggle('tier-group', state.tier);
  }
}

function updateExcl() {
  var canExcl = hasData(state.geo, state.measure, state.tier, true);
  var hasMain = hasData(state.geo, state.measure, state.tier, false);
  var row = document.getElementById('excl-row');

  if (canExcl && hasMain) {
    row.classList.add('visible');
  } else {
    row.classList.remove('visible');
    if (!hasMain && canExcl) { state.exclInUs = true; }
    else { state.exclInUs = false; }
  }

  var track = document.getElementById('excl-track');
  if (state.exclInUs) { track.classList.add('on'); } else { track.classList.remove('on'); }
}

function el(tag, attrs) {
  var e = document.createElementNS(ns, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Tier-based bar color
function getBarColor() {
  if (state.tier === 2) return '#FF7F48'; // Orange
  if (state.tier === 0) return '#E0E3FF'; // Lavender
  return '#6C9FC6'; // Steel
}

function render() {
  updateTierDisabled();
  updateExcl();

  var key = getKey(state.geo, state.measure, state.tier, state.exclInUs);
  var chart = CHART_DATA[key];
  if (!chart) return;

  document.getElementById('chart-title').textContent = chart.title;
  var axisLabel = state.measure === 'percapita' ? 'Per 1,000 inhabitants' : 'AI talent (headcount)';
  document.getElementById('axis-label').textContent = axisLabel;

  var svg = document.getElementById('chart-svg');
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  var containerW = svg.parentElement.offsetWidth;
  var totalW = containerW;
  var data = chart.data;

  var maxVal = 0;
  for (var i = 0; i < data.length; i++) { if (data[i].value > maxVal) maxVal = data[i].value; }

  var barH = data.length > 20 ? 26 : 28;
  var labelW = 160;
  var barX = labelW + 8;
  var barAreaW = totalW - labelW - 90;
  var topPad = 4;
  var totalH = data.length * barH + 20;
  var barColor = getBarColor();
  // Text color for value labels - darker for lavender bars
  var valColor = state.tier === 0 ? '#134550' : '#4a4a4a';

  svg.setAttribute('viewBox', '0 0 ' + totalW + ' ' + totalH);
  svg.style.height = totalH + 'px';

  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    var y = topPad + i * barH;
    var pct = d.value / maxVal;
    var w = pct * barAreaW;

    // Zebra
    if (i % 2 === 0) {
      svg.appendChild(el('rect', {
        x: 0, y: y, width: totalW, height: barH,
        fill: '#f8f9fb', opacity: '0.5'
      }));
    }

    // Label
    var txt = el('text', {
      x: labelW, y: y + barH / 2 + 4,
      'text-anchor': 'end', 'font-size': '12.5',
      'font-weight': '500', fill: '#2a2a2a',
      'font-family': 'Inter, system-ui, sans-serif'
    });
    txt.textContent = d.name;
    svg.appendChild(txt);

    // Bar
    var rect = el('rect', {
      x: barX, y: y + 4,
      width: '0', height: barH - 8,
      rx: '3', fill: barColor
    });
    rect.classList.add('bar-rect');
    svg.appendChild(rect);

    // Animate
    (function(r, targetW, delay) {
      setTimeout(function() { r.setAttribute('width', targetW); }, delay);
    })(rect, w, i * 15 + 30);

    // Value
    var val = el('text', {
      x: barX + w + 8, y: y + barH / 2 + 4,
      'text-anchor': 'start', 'font-size': '11.5',
      'font-weight': '600', fill: valColor,
      'font-family': 'Inter, system-ui, sans-serif',
      'font-variant-numeric': 'tabular-nums'
    });
    val.textContent = formatVal(d.value, state.measure);
    svg.appendChild(val);
  }
}

function setGeo(v) { state.geo = v; updateToggle('geo-group', v); render(); }
function setMeasure(v) { state.measure = v; updateToggle('measure-group', v); render(); }
function setTier(v) {
  var avail = getAvailTiers(state.geo, state.measure);
  if (avail.indexOf(v) === -1) return;
  state.tier = v; updateToggle('tier-group', v); render();
}
function toggleExcl() {
  state.exclInUs = !state.exclInUs;
  render();
}

window.addEventListener('load', function() { render(); });
window.addEventListener('resize', function() { render(); });
</script>
